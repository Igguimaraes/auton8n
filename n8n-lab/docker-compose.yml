services:
  postgres:
    image: postgres:16
    container_name: n8n-lab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: n8nlab
      POSTGRES_PASSWORD: n8nlab_password
      POSTGRES_DB: n8nlab

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-lab
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8nlab
      DB_POSTGRESDB_USER: n8nlab
      DB_POSTGRESDB_PASSWORD: n8nlab_password

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      WEBHOOK_URL: http://localhost:5678/

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

    depends_on:
      - postgres

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
